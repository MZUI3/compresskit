[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compresskit"
version = "0.1.0"
description = "Pruning and quantization for PyTorch models, as plain functions you import and call."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MZUI3" }]
keywords = ["pytorch", "pruning", "quantization", "model-compression", "sparsity", "qat", "ptq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0", "numpy"]

[project.optional-dependencies]
lightning = ["lightning>=2.0"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest", "lightning>=2.0"]

[project.urls]
Homepage = "https://github.com/MZUI3/compresskit"
Issues = "https://github.com/MZUI3/compresskit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
